
epochs: 15
learning_rate: 0.0001
weight_decay: 0.0001
optimizer: adamw
batch_size: 8
num_workers: 4
pin_memory: true
gradient_clip_norm: 1.0
mixed_precision: true
class_imbalance:
  strategy: weighted_cross_entropy
  class_weights: auto
  focal_gamma: 2.0

seed: ${seed}

# Optional path to a checkpoint used to continue an interrupted run.
resume_from: null

early_stopping:
  enabled: true
  patience: 4
  min_delta: 0.001
  monitor: auc
  mode: max

checkpoint:
  save_best: true
  save_last: true
  directory: ${paths.checkpoints_dir}
  best_filename: tb_efficientnet_b3_best.pt
  last_filename: tb_efficientnet_b3_last.pt

loss:
  label_smoothing: 0.0

scheduler:
  name: cosine
  min_learning_rate: 0.000001

wandb:
  enabled: true
  mode: offline
  run_name: tb-efficientnet-b3-centralized